name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail if French leftovers or TODO markers are found"
        type: boolean
        default: false
      publish:
        description: "Force (or skip) the GitHub Pages deployment"
        type: boolean
        default: true

permissions:
  contents: read

# GitHub Pages refuses concurrent deployments and prefers the newer run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Every directory holding a src/main.tex is one document to build.
  # ------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      documents: ${{ steps.find.outputs.documents }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          docs=$(find . -mindepth 2 -maxdepth 3 -type f -path '*/src/main.tex' \
                 -not -path './.git/*' | sed 's#/src/main.tex##; s#^\./##' | sort)
          echo "Found documents:"
          echo "$docs" | sed 's/^/  - /'
          count=$(echo "$docs" | grep -c . || true)
          echo "Total: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No documents found (expected */src/main.tex)"
            exit 1
          fi
          {
            echo "documents<<EOF"
            echo "$docs" | jq -R -s -c 'split("\n") | map(select(length > 0))'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Work out which document directories actually changed.  A push that
  # only touches AGENTS.md or tools/ must not rebuild every paper.
  # Manual runs build everything; CI changes also build everything so a
  # workflow edit is exercised on the spot.
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dirs.outputs.matrix }}
      count: ${{ steps.dirs.outputs.count }}
      site: ${{ steps.dirs.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: dirs
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          docs = sorted(str(p.parent.parent) for p in pathlib.Path(".").glob("*/src/main.tex"))
          event = os.environ["EVENT"]
          before = os.environ.get("BEFORE") or ""
          base = os.environ.get("PR_BASE") or ""
          sha = os.environ["SHA"]

          def all_docs():
              return docs

          build = None
          site = event == "workflow_dispatch"
          if event != "workflow_dispatch":
              cmp_base = base if event == "pull_request" else before
              if cmp_base and set(cmp_base) != {"0"}:
                  try:
                      subprocess.run(
                          ["git", "cat-file", "-e", f"{cmp_base}^{{commit}}"],
                          check=True, capture_output=True,
                      )
                      names = subprocess.run(
                          ["git", "diff", "--name-only", cmp_base, sha],
                          check=True, capture_output=True, text=True,
                      ).stdout.splitlines()
                  except subprocess.CalledProcessError:
                      names = None
              else:
                  names = None

              if names is None:
                  # New branch or shallow/rebased history: be safe.
                  build = all_docs()
              else:
                  selected = set()
                  force_all = False
                  for name in names:
                      top = name.split("/", 1)[0]
                      if top in docs:
                          selected.add(top)
                      elif top == ".github":
                          # A workflow change must be exercised end to end.
                          force_all = True
                      elif name in ("tools/make_site.py", "tools/translation_report.py"):
                          # These change the landing page, not the PDFs.
                          site = True
                  build = all_docs() if force_all else sorted(selected)

          if build is None:
              build = all_docs()

          site = site or bool(build)
          print("Documents to build:", build or "(none)")
          print("Rebuild site:", site)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(build)}\n")
              f.write(f"count={len(build)}\n")
              f.write(f"site={'true' if site else 'false'}\n")
          PY

  # ------------------------------------------------------------------
  # Translation status: progress table + untranslated-passage detection.
  # ------------------------------------------------------------------
  report:
    runs-on: ubuntu-latest
    needs: discover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Translation report
        run: python tools/translation_report.py . --format text | tee report.txt

      - name: Write job summary
        run: |
          {
            echo "# Translation status"
            echo
            python tools/translation_report.py . --format markdown
            echo
            echo 'Full output: `report.txt` in this run'"'"'s logs.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Every file must declare pages and status
        run: |
          python tools/translation_report.py . --format json > report.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d = json.load(open("report.json"))
          print(f"REPORT_METADATA={d['missing_metadata']}")
          print(f"REPORT_LEFTOVERS={d['leftovers']}")
          print(f"REPORT_MARKERS={d['markers']}")
          PY

      - name: Fail on missing metadata
        run: |
          if [ "$REPORT_METADATA" != "0" ]; then
            echo "::error::$REPORT_METADATA .tex file(s) lack %@ pages / %@ status metadata"
            exit 1
          fi
          echo "OK. $REPORT_LEFTOVERS French leftover(s), $REPORT_MARKERS TODO marker(s)."

      - name: Fail on leftovers or markers (manual strict runs)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict }}
        run: python tools/translation_report.py . --strict

  # ------------------------------------------------------------------
  # Compile the changed documents inside a current TeX Live container.
  # ------------------------------------------------------------------
  build:
    needs: [discover, changes]
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    # Current TeX Live, with latexmk, pdflatex, xelatex and lualatex.
    # To pin a specific release (if a TeX Live update ever breaks a build),
    # replace this with an explicit tag, e.g. texlive/texlive:TL2024-historic.
    # NOTE: this field does not accept the `env` context, so the image cannot
    # be factored out into a workflow-level `env:` variable.
    container: texlive/texlive:latest
    strategy:
      fail-fast: false
      matrix:
        document: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Show the TeX installation
        run: |
          pdflatex --version | head -2
          latexmk --version | head -1

      - name: Compile ${{ matrix.document }}
        run: |
          cd "${{ matrix.document }}/src"
          latexmk \
            -pdf \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            -outdir=../build \
            main.tex
          # Give the PDF a stable, self-describing name for the website.
          mv ../build/main.pdf "../build/${{ matrix.document }}.pdf"
          ls -lh "../build/${{ matrix.document }}.pdf"
          # pdfinfo (poppler-utils) is not in the texlive container; use it when present.
          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo "../build/${{ matrix.document }}.pdf" | grep -E '^(Pages|File size)'
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.document }}
          path: ${{ matrix.document }}/build/${{ matrix.document }}.pdf
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Assemble the static site and hand it to GitHub Pages.
  # ------------------------------------------------------------------
  site:
    needs: [discover, changes, report, build]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.report.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'failure' ||
       needs.build.result == 'skipped') &&
      (needs.changes.outputs.site == 'true') &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect freshly built PDFs
        if: >-
          needs.changes.outputs.count != '0' &&
          (needs.build.result == 'success' || needs.build.result == 'failure')
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          path: _site/pdfs
          merge-multiple: true

      - name: Reuse previously deployed PDFs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys, urllib.request

          out = pathlib.Path("_site/pdfs")
          out.mkdir(parents=True, exist_ok=True)
          docs = sorted(str(p.parent.parent) for p in pathlib.Path(".").glob("*/src/main.tex"))
          missing = []
          for doc in docs:
              dest = out / f"{doc}.pdf"
              if dest.exists():
                  continue
              url = f"{os.environ['SITE_URL'].rstrip('/')}/pdfs/{doc}.pdf"
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      dest.write_bytes(r.read())
                  print(f"reused {url}")
              except Exception as exc:
                  print(f"MISSING {doc}: {exc}", file=sys.stderr)
                  missing.append(doc)
          if missing:
              print(f"::warning::{len(missing)} PDF(s) unavailable from build and live site: {', '.join(missing)}")
          PY

      - name: Build the landing page
        run: python tools/make_site.py --site _site --root .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4